[project]
name = "paperqueue"
version = "0.1.0"
description = "A terminal stack of papers to read"
readme = "README.md"
authors = [
    { name = "Paolo Rabino", email = "paolo.98.tron@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
paperqueue = "paperqueue.app:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
